name: Feature request
description: Suggest an improvement to XRatio.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Tell us what would make XRatio more useful for your workflow.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I have searched the existing issues for a similar request.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Interception
        - Simulation
        - Settings
        - Onboarding or help
        - Updates
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task that is currently difficult or impossible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior or interface you would find useful.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or links if they help explain the request.
    validations:
      required: false
